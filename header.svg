<svg width="854" height="185" viewBox="0 0 854 185" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1C2128" stroke-width="0.6"/>
    </pattern>

    <linearGradient id="beam-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00CCFF" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#00CCFF" stop-opacity="0.055"/>
      <stop offset="50%"  stop-color="#00CCFF" stop-opacity="0.1"/>
      <stop offset="65%"  stop-color="#00CCFF" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#00CCFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="cyan-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="green-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Typewriter clip paths: each reveals one text line -->
    <clipPath id="cp1">
      <rect x="50" y="56" width="0" height="26">
        <animate attributeName="width" from="0" to="320" dur="1.4s" begin="0.8s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="cp2">
      <rect x="50" y="84" width="0" height="26">
        <animate attributeName="width" from="0" to="370" dur="1.6s" begin="2.5s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="cp3">
      <rect x="50" y="112" width="0" height="26">
        <animate attributeName="width" from="0" to="260" dur="1.1s" begin="4.4s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>

    <style>
      @keyframes beam-sweep {
        0%   { transform: translateX(-250px) skewX(-14deg); opacity: 0; }
        8%   { opacity: 1; }
        92%  { opacity: 1; }
        100% { transform: translateX(1060px) skewX(-14deg); opacity: 0; }
      }
      @keyframes cursor-blink {
        0%, 48% { opacity: 1; }
        50%, 98% { opacity: 0; }
        100%     { opacity: 1; }
      }
      @keyframes status-pulse {
        0%, 100% { opacity: 0.65; }
        50%       { opacity: 1; }
      }
      @keyframes green-dot {
        0%, 100% { fill: #27C93F; }
        50%       { fill: #3dff55; }
      }
    </style>
  </defs>

  <!-- Title bar -->
  <rect width="854" height="36" fill="#161B22"/>
  <line x1="0" y1="36" x2="854" y2="36" stroke="#30363D" stroke-width="1"/>

  <!-- macOS-style window dots -->
  <circle cx="25" cy="18" r="5.5" fill="#FF5F56"/>
  <circle cx="46" cy="18" r="5.5" fill="#FFBD2E"/>
  <circle cx="67" cy="18" r="5.5" style="animation: green-dot 2.2s ease-in-out infinite;"/>

  <!-- Title bar text -->
  <text x="427" y="23"
    font-family="'Courier New', Courier, monospace"
    font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="1.5">
    simcom-terminal  —  bash
  </text>

  <!-- Right-side status in title bar -->
  <circle cx="790" cy="18" r="4" fill="#2ECC71" style="animation: status-pulse 2s ease-in-out infinite;"/>
  <text x="800" y="23"
    font-family="'Courier New', Courier, monospace"
    font-size="9.5" fill="#2ECC71" letter-spacing="1">
    RUNNING
  </text>

  <!-- Content area -->
  <rect x="0" y="36" width="854" height="149" fill="#0D1117"/>
  <rect x="0" y="36" width="854" height="149" fill="url(#grid)"/>

  <!-- Scanning beam (CSS animated, skewed gradient rect) -->
  <rect x="0" y="36" width="200" height="149" fill="url(#beam-fill)"
    style="animation: beam-sweep 5.5s ease-in-out 1s infinite; transform-box: fill-box; transform-origin: 0 0;"/>

  <!-- Vertical divider separating text from sidebar -->
  <line x1="595" y1="48" x2="595" y2="173" stroke="#30363D" stroke-width="0.8"/>
  <line x1="596" y1="48" x2="596" y2="173" stroke="#00CCFF" stroke-width="0.3" opacity="0.35"/>

  <!-- Typewriter Line 1: KERNEL -->
  <text clip-path="url(#cp1)" x="50" y="76"
    font-family="'Courier New', Courier, monospace"
    font-size="14.5" fill="#00CCFF" letter-spacing="1.5"
    filter="url(#cyan-glow)">
    &gt; KERNEL: SimCom v2.5
  </text>

  <!-- Typewriter Line 2: ARCH -->
  <text clip-path="url(#cp2)" x="50" y="104"
    font-family="'Courier New', Courier, monospace"
    font-size="14.5" fill="#c9d1d9" letter-spacing="1.5">
    &gt; ARCH: 16-BIT VON NEUMANN
  </text>

  <!-- Typewriter Line 3: STATUS -->
  <text clip-path="url(#cp3)" x="50" y="132"
    font-family="'Courier New', Courier, monospace"
    font-size="14.5" fill="#2ECC71" letter-spacing="1.5"
    filter="url(#green-glow)">
    &gt; STATUS: ONLINE
  </text>

  <!-- Blinking block cursor after all lines appear -->
  <rect x="50" y="144" width="10" height="3" fill="#00CCFF">
    <animate attributeName="opacity" values="0;0;0;0;0;1;0;1;0;1;0;1" dur="1.2s" begin="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Sidebar: system specs -->
  <text x="612" y="65"
    font-family="'Courier New', Courier, monospace"
    font-size="8.5" fill="#8b949e" letter-spacing="3" opacity="0.7">
    // SYS_INFO
  </text>
  <line x1="612" y1="71" x2="838" y2="71" stroke="#30363D" stroke-width="0.7"/>

  <text x="612" y="88"  font-family="'Courier New', monospace" font-size="9" fill="#8b949e">MEM_SPACE <tspan fill="#00CCFF" dx="4">512W</tspan></text>
  <text x="612" y="104" font-family="'Courier New', monospace" font-size="9" fill="#8b949e">WORD_SIZE <tspan fill="#00CCFF" dx="4">16-BIT</tspan></text>
  <text x="612" y="120" font-family="'Courier New', monospace" font-size="9" fill="#8b949e">ISA_OPS   <tspan fill="#00CCFF" dx="4">22</tspan></text>
  <text x="612" y="136" font-family="'Courier New', monospace" font-size="9" fill="#8b949e">SEGMENTS  <tspan fill="#00CCFF" dx="4">CS/DS/SS</tspan></text>
  <text x="612" y="152" font-family="'Courier New', monospace" font-size="9" fill="#8b949e">REGISTERS <tspan fill="#00CCFF" dx="4">18</tspan></text>
  <text x="612" y="168" font-family="'Courier New', monospace" font-size="9.5" fill="#2ECC71"
    style="animation: status-pulse 2.5s ease-in-out infinite;">
    ● STATUS: STABLE
  </text>

  <!-- Bottom rule -->
  <line x1="0" y1="184" x2="854" y2="184" stroke="#30363D" stroke-width="0.8"/>
</svg>
